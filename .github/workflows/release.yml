# Stages a release on npm when a version tag (v1.2.3) is pushed; a maintainer then approves it with 2FA.
#
# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere, and npm attaches provenance that
# links the package to this repository, workflow and commit. The trusted publisher is stage-only (npm's
# default since 2026-09-03), so CI can never publish on its own: a human confirms every release.
#
# One-time setup on npmjs.com: package "mandat" -> Settings -> Trusted Publisher -> GitHub Actions,
# owner "vosidov-msaid", repository "Mandat", workflow "release.yml".
# Approve each staged release: npmjs.com -> mandat -> Staged Packages, or `npm stage approve <stage-id>`.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1; }
      - name: Version must not be on npm yet
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "mandat@$version" version >/dev/null 2>&1; then
            echo "::error::mandat@$version is already published. Bump the version (npm version patch) and push the new tag."
            exit 1
          fi
      - name: npm must support staged publishing (>= 11.15.0)
        run: node -e "const [a,b]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&b>=15)?0:1)" "$(npm --version)"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Stage the release (provenance is added automatically)
        run: |
          set -o pipefail
          npm stage publish . 2>&1 | tee stage.log
      - name: Tell the maintainer how to approve
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "## mandat@$version is staged, not yet published"
            echo ""
            echo "Approve it with 2FA: **npmjs.com → mandat → Staged Packages**, or run \`npm stage list mandat\` and \`npm stage approve <stage-id>\`."
            echo ""
            echo '```'
            cat stage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
