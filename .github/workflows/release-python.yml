# Publishes the Python SDK to PyPI when a tag like py-v0.1.0 is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): no PyPI token is stored anywhere, and the upload carries a
# digital attestation linking it to this repository, workflow and commit.
# One-time setup on pypi.org: Account -> Publishing -> add a (pending) publisher for project "mandat":
# owner "vosidov-msaid", repository "Mandat", workflow "release-python.yml", environment "pypi".
# Protect the "pypi" environment in GitHub (Settings -> Environments -> required reviewers) so a
# maintainer approves each release.
name: release-python
on:
  push:
    tags: ["py-v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Tag must match pyproject version
        run: |
          expected="py-v$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME does not match pyproject.toml ($expected)"; exit 1; }
      - run: npm ci --ignore-scripts
      - working-directory: python
        run: python -m pip install -r requirements-dev.txt -e . build==1.6.1
      - working-directory: python
        run: python -m unittest discover -s tests -v
      - working-directory: python
        run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: python/dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
