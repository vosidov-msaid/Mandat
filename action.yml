name: "Mandat MCP Scanner"
description: "Scan MCP client configs, MCP server source and live MCP endpoints for authentication and supply-chain risks. Emits SARIF."
author: "Mandat"
branding:
  icon: "shield"
  color: "blue"
inputs:
  configs:
    description: "Space-separated MCP config files (e.g. .mcp.json .cursor/mcp.json .vscode/mcp.json)"
    default: ""
  src:
    description: "Source directory of your MCP server to scan"
    default: ""
  url:
    description: "Optional live MCP endpoint to scan"
    default: ""
  fail-on:
    description: "Fail on findings at or above: critical | high | medium | low | none"
    default: "high"
outputs:
  sarif:
    description: "Path of the SARIF report (config and source findings)"
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    # The action runs Mandat's TypeScript sources directly, which needs Node >= 23.6.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version: 24 }
    - id: scan
      shell: bash
      env:
        CONFIGS: ${{ inputs.configs }}
        SRC: ${{ inputs.src }}
        URL: ${{ inputs.url }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -u
        status=0
        out="$RUNNER_TEMP/mandat.sarif"
        args=()
        [ -n "$SRC" ] && args+=(--src "$SRC")
        if [ -n "$CONFIGS" ] || [ -n "$SRC" ]; then
          # shellcheck disable=SC2086
          node "$GITHUB_ACTION_PATH/bin/mandat.ts" scan-config $CONFIGS "${args[@]}" --format sarif --out "$out" --fail-on "$FAIL_ON" || status=$?
        fi
        if [ -n "$URL" ]; then
          node "$GITHUB_ACTION_PATH/bin/mandat.ts" scan "$URL" --format text --fail-on "$FAIL_ON" || status=$?
        fi
        echo "sarif=$out" >> "$GITHUB_OUTPUT"
        exit $status
